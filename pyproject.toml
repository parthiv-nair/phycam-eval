[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phycam-eval"
version = "0.1.0"
description = "Stage-aware physical camera forward models for detector robustness evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Parthiv Nair", email = "parthivnair@harvard.edu" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = [
    "camera",
    "computer-vision",
    "fourier-optics",
    "image-formation",
    "object-detection",
    "robustness",
    "sensor-noise",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/parthiv-nair/phycam-eval"

[project.scripts]
phycam-coco-study = "phycam_eval.cli.coco_study:main"

[project.optional-dependencies]
eval = [
    "huggingface-hub>=0.23",
    "pillow>=10.0",
    "pycocotools>=2.0",
    "safetensors>=0.4",
    "timm>=0.9",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=4.40",
    "ultralytics==8.4.37",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phycam_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
